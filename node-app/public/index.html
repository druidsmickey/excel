<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Row Tracker</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
  h1 { font-size: 20px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; }
  th { background: #1f4e78; color: #fff; padding: 0; text-align: center; white-space: nowrap; }
  th.plain { padding: 8px 10px; }
  /* Column header: name on top, select / sort / delete controls underneath, so the column can be narrow. */
  th .hd { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; width: 92px; margin: 0 auto; padding-bottom: 2px; }
  th input[type=text] { background: transparent; color: #fff; border: 0; font: inherit; font-weight: bold; text-align: center; padding: 6px 4px 2px; order: -1; flex: 0 0 100%; width: 100%; box-sizing: border-box; }
  th button { background: transparent; color: #cfe2f3; border: 0; padding: 0 8px; }
  th input[type=text]::placeholder { color: rgba(255, 255, 255, .4); font-weight: normal; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover, th button.sort:hover { background: #2b6aa0; }
  th.colsel { outline: 3px solid #ffd966; outline-offset: -3px; }
  td { border: 1px solid #ccc; padding: 0; }
  tbody tr:nth-child(even) { background: #ddebf7; }   /* highlight even rows */
  tbody tr.selected { background: #ffe699 !important; }
  td.colsel { box-shadow: inset 0 0 0 9999px rgba(255, 217, 102, .45); }
  td.cellsel { box-shadow: inset 0 0 0 9999px rgba(91, 155, 213, .35), inset 0 0 0 2px #1f4e78; }
  tr.letters th { background: #e7e6e6; color: #666; font-size: 11px; font-weight: normal; padding: 2px; }
  .rn { color: #888; font-size: 11px; margin-left: 4px; user-select: none; }
  td.chk { white-space: nowrap; padding: 0 6px; }
  th.idc, td.idc { box-sizing: border-box; width: 124px; min-width: 124px; max-width: 124px; }   /* ID column: fits 10 characters */
  td input { width: 100%; box-sizing: border-box; border: 0; background: transparent; padding: 8px 10px; font: inherit; }
  td input.code { font-size: 15px; }
  td input.num { text-align: right; min-width: 92px; padding: 8px 6px; font-size: 14px; }   /* fits 10,000,000 */
  td.chk, th.chk { width: 32px; text-align: center; }
  td.chk input, th input[type=checkbox] { width: auto; padding: 0; cursor: pointer; }
  th .hd input[type=checkbox] { margin: 0 6px 0 0; }
  td.total { font-weight: bold; text-align: right; padding: 8px 10px; }
  td.upd { padding: 8px 10px; white-space: nowrap; color: #444; }
  button { font: inherit; cursor: pointer; }
  .actions { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .danger { color: #a00; }
  button:disabled { cursor: default; opacity: .45; }
  #sel { color: #555; font-size: 14px; }
  /* ---- Mobile / touch ---- */
  html { -webkit-text-size-adjust: 100%; }
  button, input { touch-action: manipulation; }
  .scroll { -webkit-overflow-scrolling: touch; }
  /* Keep the row checkbox + ID visible while scrolling sideways. */
  th.chk, td.chk, tr.letters th:first-child { position: sticky; left: 0; z-index: 2; width: 58px; min-width: 58px; max-width: 58px; box-sizing: border-box; }
  th.idc, td.idc, tr.letters th:nth-child(2) { position: sticky; left: 58px; z-index: 2; }
  th.chk, th.idc { background: #1f4e78; }
  tr.letters th:first-child, tr.letters th:nth-child(2) { background: #e7e6e6; }
  td.chk, td.idc { background: #fff; box-shadow: inset -1px 0 0 #ccc; }
  tbody tr:nth-child(even) td.chk, tbody tr:nth-child(even) td.idc { background: #ddebf7; }
  tbody tr.selected td.chk, tbody tr.selected td.idc { background: #ffe699; }
  /* "Select cells" mode (touch has no Ctrl key): taps pick cells instead of editing them. */
  body.selmode td input { pointer-events: none; }
  #selMode.on { background: #1f4e78; color: #fff; }
  /* The cell being edited stands out, and clicking into it selects its whole value. */
  td:has(input:focus:not(.pick)) { outline: 2px solid #1f4e78; outline-offset: -2px; background: #fff8dc !important; }
  td input::selection { background: #1f4e78; color: #fff; }
  #search { padding: 7px 10px; font: inherit; border: 1px solid #aaa; border-radius: 4px; width: 240px; max-width: 100%; box-sizing: border-box; }
  #count { color: #555; font-size: 14px; }
  #status { font-size: 14px; color: #2e7d32; min-width: 120px; }
  #status.err { color: #a00; font-weight: bold; }
  td.none { text-align: center; color: #666; padding: 16px; }
  /* No up/down spinner arrows on number cells (arrow keys move between rows instead). */
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  /* Totals row */
  tfoot td { background: #e8eef5; font-weight: bold; text-align: right; padding: 8px 10px; border-top: 2px solid #1f4e78; white-space: nowrap; }
  tfoot td.chk, tfoot td.idc { background: #e8eef5; text-align: left; }
  tfoot td.grand { background: #1f4e78; color: #fff; }
  @media (max-width: 700px) {
    body { margin: 10px; }
    h1 { font-size: 18px; margin: 4px 0; }
    button { min-height: 40px; padding: 6px 12px; }
    .actions { gap: 6px; }
    #sel { flex-basis: 100%; order: 10; }
    #search { flex: 1 1 100%; width: 100%; font-size: 16px; }
    #changePw, #logout { margin-left: 0 !important; }
    table { min-width: 0; }
    td input, th input[type=text] { font-size: 16px; }   /* 16px stops iOS zooming into inputs */
    td input { padding: 10px 8px; }
    td input.num { min-width: 106px; }
    td input[type=checkbox], th input[type=checkbox] { width: 22px; height: 22px; }
    th.sortable, th button { padding-top: 10px; padding-bottom: 10px; }
  }
</style>
</head>
<body>
<h1>Row Tracker</h1>
<div class="actions">
  <input id="search" type="search" placeholder="Search by ID or value..." aria-label="Search rows" autocomplete="off">
  <span id="count"></span>
  <span id="status" role="status"></span>
</div>
<div class="actions">
  <button id="addTop">+ Add row</button>
  <button id="addColTop">+ Add column</button>
  <span style="width:16px"></span>
  <button id="selMode" title="Tap cells to select them (for touch screens)">Select cells: off</button>
  <button id="clearCells" disabled>Clear selected cells</button>
  <button id="clear" disabled>Clear selected values</button>
  <button id="delSel" class="danger" disabled>Delete selected</button>
  <span id="sel"></span>
  <button id="undo" disabled title="Undo the last change (Ctrl+Z). Up to 10 changes can be undone.">&#8630; Undo</button>
  <button id="redo" disabled title="Redo the change you just undid (Ctrl+Y)">&#8631; Redo</button>
  <button id="changePw" style="margin-left:auto">Change password</button>
  <button id="logout">Log out</button>
</div>
<div class="scroll">
<table>
  <thead id="head"></thead>
  <tbody id="body"></tbody>
  <tfoot id="foot"></tfoot>
</table>
</div>
<div class="actions">
  <button id="add">+ Add row</button>
  <button id="addCol">+ Add column</button>
  <button id="csv">Download CSV</button>
</div>
<script>
const head = document.getElementById('head');
const body = document.getElementById('body');
const foot = document.getElementById('foot');
// Numbers are shown with thousands separators, e.g. 12,345,678 (decimals only when there are some).
const fmt = (n) => n.toLocaleString('en-US', { maximumFractionDigits: 6 });
const parseNum = (str) => parseFloat(String(str).replace(/,/g, '')) || 0;   // reads "1,234.5" or "1234.5"
const MAX_VALUE = 10000000;   // largest number a cell can hold (the server enforces this too)
const limit = (n) => Math.max(-MAX_VALUE, Math.min(MAX_VALUE, n));
const stamp = (iso) => {
  const d = new Date(iso), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
};
// The app may be served from a sub-path (e.g. /rowtracker), so build URLs from the page location.
const BASE = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
const u = (p) => BASE + p.replace(/^\//, '');
// Every request is tracked so we can tell the user whether their changes are saved, wait for
// them before logging out, and warn before the page is closed while something is still saving.
const pending = new Set();
let lastApi = Date.now();
const statusEl = document.getElementById('status');
const setStatus = (text, isError) => { statusEl.textContent = text; statusEl.classList.toggle('err', Boolean(isError)); };

const api = (method, url, data) => {
  lastApi = Date.now();
  const p = fetch(u(url), {
    method, headers: { 'Content-Type': 'application/json' }, body: data ? JSON.stringify(data) : undefined,
    keepalive: true,   // lets a save finish even if the page is closing
  }).then(async (r) => {
    if (r.status === 401) { location.reload(); throw new Error('Session expired'); }   // back to the login page
    setUndo(Number(r.headers.get('X-Undo-Count')) || 0, Number(r.headers.get('X-Redo-Count')) || 0);
    const json = await r.json();
    if (!r.ok) throw new Error(json.error || `Server error ${r.status}`);
    return json;
  });
  if (method !== 'GET') {
    pending.add(p);
    setStatus('Saving...');
    const done = (ok, err) => {
      pending.delete(p);
      if (!ok) setStatus(`NOT SAVED: ${err.message}`, true);
      else if (!pending.size) setStatus('All changes saved');
    };
    p.then(() => done(true), (e) => done(false, e));
  }
  return p;
};
const settled = () => Promise.allSettled([...pending]);

// Undo / Redo: the server keeps a copy of the table from before each of the last 10 changes (and the ones
// you have undone), so both buttons just ask it to step back or forward.
const undoBtn = document.getElementById('undo');
const redoBtn = document.getElementById('redo');
function setUndo(undoCount, redoCount) {
  undoBtn.disabled = !undoCount;
  undoBtn.textContent = undoCount ? `\u21B6 Undo (${undoCount})` : '\u21B6 Undo';
  redoBtn.disabled = !redoCount;
  redoBtn.textContent = redoCount ? `\u21B7 Redo (${redoCount})` : '\u21B7 Redo';
}
async function step(kind) {   // kind: 'undo' | 'redo'
  if ((kind === 'undo' ? undoBtn : redoBtn).disabled) return;
  document.activeElement?.blur();   // commit a half-typed cell, then wait for it, so we step from the right place
  await settled();
  try {
    load(await api('POST', `/api/${kind}`));
    setStatus(kind === 'undo' ? 'Undone' : 'Redone');
  } catch (e) { setStatus(`Could not ${kind}: ${e.message}`, true); }
}
undoBtn.addEventListener('click', () => step('undo'));
redoBtn.addEventListener('click', () => step('redo'));
document.addEventListener('keydown', (e) => {
  // Ctrl/Cmd+Z = undo, Ctrl+Y or Ctrl+Shift+Z = redo, except while typing in a box (where they act on the typing).
  if (!(e.ctrlKey || e.metaKey) || e.target.matches('input, textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); step('undo'); }
  else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); step('redo'); }
});
window.addEventListener('beforeunload', (e) => { if (pending.size) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.hidden) document.activeElement?.blur(); });   // commit a half-typed cell

let query = '';   // lower-cased search text
let plain = '';   // the same without thousands commas, for matching raw numbers
const matches = (r) => !query ||
  r.code.toLowerCase().includes(query) ||
  [...r.values, total(r)].some((v) => String(v).includes(plain) || fmt(v).includes(query));

let columns = [];
let rows = [];
let sort = null;            // { key: 'code' | 'total' | 'upd' | column index, dir: 1 (ascending) | -1 }
const selRows = new Set();  // selected row ids
const selCols = new Set();  // selected column indexes
const selCells = new Set(); // selected single cells, keyed "rowId:col" (col = column index or 'code')
let anchor = null;          // last clicked cell, for Shift+click ranges

const letters = (n) => { let s = ''; for (n++; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + ((n - 1) % 26)) + s; return s; };

const total = (r) => r.values.reduce((a, b) => a + b, 0);
const sortValue = (r, key) => key === 'code' ? r.code : key === 'total' ? total(r) : key === 'upd' ? r.updatedAt : r.values[key];

function sortedRows() {
  if (!sort) return rows;
  return [...rows].sort((a, b) => {
    const x = sortValue(a, sort.key), y = sortValue(b, sort.key);
    const c = typeof x === 'string' ? x.localeCompare(y, undefined, { numeric: true, sensitivity: 'base' }) : x - y;
    return c * sort.dir;
  });
}

// First click sorts ascending, second click descending, third click clears the sort.
function toggleSort(key) {
  if (!sort || sort.key !== key) sort = { key, dir: 1 };
  else if (sort.dir === 1) sort.dir = -1;
  else sort = null;
  renderAll();
}

const arrow = (key) => sort && sort.key === key ? (sort.dir === 1 ? ' ▲' : ' ▼') : '';

function updateToolbar() {
  const r = selRows.size, c = selCols.size, n = selCells.size;
  document.getElementById('clear').disabled = document.getElementById('delSel').disabled = !(r || c);
  document.getElementById('clearCells').disabled = !n;
  document.getElementById('sel').textContent = (r || c || n)
    ? `Selected: ${n} cell${n === 1 ? '' : 's'}, ${r} row${r === 1 ? '' : 's'}, ${c} column${c === 1 ? '' : 's'}`
    : 'Select cells with Ctrl+click (or the Select cells button on touch screens), then clear them. You can also tick rows / columns.';
  body.querySelectorAll('td[data-cell]').forEach((td) =>
    td.classList.toggle('cellsel', selCells.has(`${td.closest('tr').dataset.id}:${td.dataset.cell}`)));
  body.querySelectorAll('tr').forEach((tr) => tr.classList.toggle('selected', selRows.has(Number(tr.dataset.id))));
  body.querySelectorAll('td[data-col]').forEach((td) => td.classList.toggle('colsel', selCols.has(Number(td.dataset.col))));
  head.querySelectorAll('th[data-col]').forEach((th) => th.classList.toggle('colsel', selCols.has(Number(th.dataset.col))));
  const all = head.querySelector('.all');
  const visible = rows.filter(matches);
  if (all) all.checked = visible.length > 0 && visible.every((r) => selRows.has(r.id));
}

function renderHead() {
  head.innerHTML = '<tr class="letters"><th></th><th>' + letters(0) + '</th>' +
    columns.map((_, i) => `<th>${letters(i + 1)}</th>`).join('') + '<th></th><th></th></tr>' +
    '<tr><th class="chk"><input type="checkbox" class="all" title="Select all rows"></th>' +
    '<th class="plain sortable idc" data-key="code">ID' + arrow('code') + '</th>' +
    columns.map((_, i) => `<th data-col="${i}"><div class="hd"><input type="checkbox" class="pick" title="Select column"><input type="text" size="1" placeholder="name" aria-label="Column name"><button class="sort" title="Sort">${arrow(i) || '↕'}</button></div></th>`).join('') +
    '<th class="plain sortable" data-key="total">Total' + arrow('total') + '</th>' +
    '<th class="plain sortable" data-key="upd">Last Updated' + arrow('upd') + '</th></tr>';
  head.querySelectorAll('.sortable').forEach((th) => th.addEventListener('click', () => toggleSort(th.dataset.key)));
  head.querySelector('.all').addEventListener('change', (e) => {
    selRows.clear();
    if (e.target.checked) rows.filter(matches).forEach((r) => selRows.add(r.id));
    updateToolbar();
  });
  head.querySelectorAll('.hd').forEach((hd, i) => {
    const input = hd.querySelector('input[type=text]');
    input.value = columns[i];
    const pick = hd.querySelector('.pick');
    pick.checked = selCols.has(i);
    pick.addEventListener('change', () => { pick.checked ? selCols.add(i) : selCols.delete(i); updateToolbar(); });
    hd.querySelector('.sort').addEventListener('click', () => toggleSort(i));
    input.addEventListener('change', async () => {
      columns = (await api('PUT', `/api/columns/${i}`, { name: input.value })).columns;
      renderHead(); updateToolbar();
    });
  });
}

function render() {
  body.innerHTML = '';
  let shown = 0;
  sortedRows().forEach((row, n) => {
    if (!matches(row)) return;   // row numbers (n + 2) keep their place, so they match the full table
    shown++;
    const tr = document.createElement('tr');
    tr.dataset.id = row.id;
    tr.innerHTML = `<td class="chk"><input type="checkbox" class="pick" title="Select row"><span class="rn">${n + 2}</span></td><td class="idc" data-cell="code"><input type="text" class="code" maxlength="10" size="1"></td>` +
      columns.map((_, i) => `<td data-col="${i}" data-cell="${i}"><input class="num" type="text" inputmode="decimal" autocomplete="off" maxlength="12" size="1"></td>`).join('') +
      '<td class="total"></td><td class="upd"></td>';
    const pick = tr.querySelector('.pick');
    pick.checked = selRows.has(row.id);
    pick.addEventListener('change', () => { pick.checked ? selRows.add(row.id) : selRows.delete(row.id); updateToolbar(); });
    const inputs = tr.querySelectorAll('input:not(.pick)');
    inputs[0].value = row.code;
    row.values.forEach((v, i) => { inputs[i + 1].value = fmt(v); });
    const nums = () => [...inputs].slice(1).map((inp) => parseNum(inp.value));
    const refresh = () => {
      tr.querySelector('.total').textContent = fmt(nums().reduce((a, b) => a + b, 0));
      tr.querySelector('.upd').textContent = stamp(row.updatedAt);
    };
    refresh();
    const save = async () => {
      row.code = inputs[0].value;
      row.values = nums();
      row.updatedAt = (await api('PUT', `/api/rows/${row.id}`, row)).updatedAt;
      refresh();
    };
    inputs.forEach((inp, i) => {
      inp.addEventListener('change', save);
      if (i > 0) inp.addEventListener('input', () => {   // live total while typing
        tr.querySelector('.total').textContent = fmt(nums().reduce((a, b) => a + b, 0));
      });
    });
    body.appendChild(tr);
  });
  if (!shown && rows.length) body.innerHTML = `<tr><td class="none" colspan="${columns.length + 4}">No rows match "${query.replace(/</g, '&lt;')}"</td></tr>`;
  document.getElementById('count').textContent = query ? `${shown} of ${rows.length} rows` : '';
  updateFooter();
}

// Search by ID or by any value (including the total). Hidden rows are dropped from the selection so
// "Clear selected" / "Delete selected" can never touch rows you can't see.
document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value.trim().toLowerCase();
  plain = query.replace(/,/g, '');
  const visible = new Set(rows.filter(matches).map((r) => r.id));
  for (const id of [...selRows]) if (!visible.has(id)) selRows.delete(id);
  for (const k of [...selCells]) if (!visible.has(Number(k.split(':')[0]))) selCells.delete(k);
  render(); updateToolbar();
});
document.getElementById('search').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.target.value = ''; e.target.dispatchEvent(new Event('input')); }
});

// Totals row: the sum of each column and the grand total, for the rows currently shown (so a search
// gives the total of the matching rows). Read from the cells, so it updates as you type.
function updateFooter() {
  const sums = columns.map(() => 0);
  body.querySelectorAll('td[data-col] input').forEach((inp) => { sums[Number(inp.closest('td').dataset.col)] += parseNum(inp.value); });
  const grand = sums.reduce((a, b) => a + b, 0);
  foot.innerHTML = `<tr><td class="chk"></td><td class="idc">${query ? 'Filtered total' : 'Total'}</td>` +
    sums.map((s) => `<td>${fmt(s)}</td>`).join('') +
    `<td class="grand">${fmt(grand)}</td><td></td></tr>`;
}
body.addEventListener('input', updateFooter);
body.addEventListener('change', updateFooter);

function renderAll() { renderHead(); render(); updateToolbar(); }

function load(state) {
  columns = state.columns;
  rows = state.rows;
  selCells.clear(); anchor = null;
  // Drop selections that no longer exist.
  for (const id of [...selRows]) if (!rows.some((r) => r.id === id)) selRows.delete(id);
  for (const i of [...selCols]) if (i >= columns.length) selCols.delete(i);
  renderAll();
}

// Adds an empty row and puts the cursor in column `col` of it ('code' = the ID cell).
async function addRow(col = 'code') {
  if (query) { query = ''; plain = ''; document.getElementById('search').value = ''; }   // so the new row is visible
  const row = await api('POST', '/api/rows', { code: '', values: columns.map(() => 0) });
  rows.push(row);
  render(); updateToolbar();
  const tr = body.querySelector(`tr[data-id="${row.id}"]`);
  tr.querySelector(`td[data-cell="${col}"] input`).focus();
  tr.scrollIntoView({ block: 'nearest' });
}

async function addColumn() {
  load(await api('POST', '/api/columns', { name: '' }));
  const cell = body.querySelector(`td[data-cell="${columns.length - 1}"] input`);   // first cell of the new column
  if (cell) { cell.focus(); cell.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
}

const selection = () => ({ rows: [...selRows], columns: [...selCols] });

document.getElementById('clear').addEventListener('click', async () => {
  const r = selRows.size, c = selCols.size;
  if (!confirm(`Clear the numbers in ${r} row(s) and ${c} column(s)? IDs are kept.`)) return;
  load(await api('POST', '/api/clear', selection()));
});

document.getElementById('delSel').addEventListener('click', async () => {
  const r = selRows.size, c = selCols.size;
  if (!confirm(`Permanently delete ${r} row(s) and ${c} column(s)?`)) return;
  const body = selection();
  selRows.clear(); selCols.clear();
  load(await api('POST', '/api/delete', body));
});

// Cell selection: Ctrl/Cmd+click toggles a cell, Shift+click selects a range, a plain click clears it.
const cellOf = (td) => ({ id: Number(td.closest('tr').dataset.id), col: td.dataset.cell === 'code' ? 'code' : Number(td.dataset.cell) });
const cellKey = (c) => `${c.id}:${c.col}`;

body.addEventListener('mousedown', (e) => {
  const td = e.target.closest('td[data-cell]');
  if (!td) return;
  const cell = cellOf(td);
  if (e.ctrlKey || e.metaKey || selectMode) {
    e.preventDefault();
    document.activeElement?.blur();
    const k = cellKey(cell);
    selCells.has(k) ? selCells.delete(k) : selCells.add(k);
    anchor = cell;
  } else if (e.shiftKey && anchor) {
    e.preventDefault();
    document.activeElement?.blur();
    const ids = [...body.querySelectorAll('tr')].map((tr) => Number(tr.dataset.id));
    const pos = (c) => ({ r: ids.indexOf(c.id), c: c.col === 'code' ? -1 : c.col });
    const a = pos(anchor), b = pos(cell);
    selCells.clear();
    for (let r = Math.min(a.r, b.r); r <= Math.max(a.r, b.r); r++)
      for (let c = Math.min(a.c, b.c); c <= Math.max(a.c, b.c); c++) selCells.add(`${ids[r]}:${c < 0 ? 'code' : c}`);
  } else {
    selCells.clear();
    anchor = cell;
  }
  updateToolbar();
});

async function clearCells() {
  const cells = [...selCells].map((k) => { const [id, col] = k.split(':'); return { id: Number(id), col: col === 'code' ? 'code' : Number(col) }; });
  if (!cells.length) return;
  selCells.clear();
  load(await api('POST', '/api/clear', { cells }));
}
let selectMode = false;
document.getElementById('selMode').addEventListener('click', (e) => {
  selectMode = !selectMode;
  document.body.classList.toggle('selmode', selectMode);
  e.currentTarget.classList.toggle('on', selectMode);
  e.currentTarget.textContent = `Select cells: ${selectMode ? 'on' : 'off'}`;
});
document.getElementById('clearCells').addEventListener('click', clearCells);
document.addEventListener('keydown', (e) => {
  if (!selCells.size) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); clearCells(); }
  else if (e.key === 'Escape') { selCells.clear(); updateToolbar(); }
});

document.getElementById('changePw').addEventListener('click', async () => {
  const current = prompt('Current password:');
  if (current === null) return;
  const next = prompt('New password:');
  if (next === null) return;
  const r = await fetch(u('/api/password'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ current, next }) });
  alert(r.ok ? 'Password changed.' : (await r.json()).error);
});

document.getElementById('logout').addEventListener('click', async () => {
  document.activeElement?.blur();
  await settled();                      // make sure everything typed has been saved
  await fetch(u('/logout'), { method: 'POST' });
  location.reload();
});

document.getElementById('add').addEventListener('click', () => addRow());
document.getElementById('addTop').addEventListener('click', () => addRow());
document.getElementById('addCol').addEventListener('click', addColumn);
document.getElementById('addColTop').addEventListener('click', addColumn);
// Enter / Arrow Down move to the same column in the next row; Shift+Enter / Arrow Up move up, like a
// spreadsheet. Enter on the last row adds a new row. Leaving the cell saves it.
body.addEventListener('keydown', async (e) => {
  if (!['Enter', 'ArrowDown', 'ArrowUp'].includes(e.key) || e.isComposing) return;
  const input = e.target;
  const td = input.closest('td[data-cell]');
  if (!td || !input.matches('input:not(.pick)')) return;
  e.preventDefault();
  const tr = td.closest('tr');
  const col = td.dataset.cell;
  const up = e.key === 'ArrowUp' || (e.key === 'Enter' && e.shiftKey);
  const next = up ? tr.previousElementSibling : tr.nextElementSibling;
  const target = next?.querySelector(`td[data-cell="${col}"] input`);
  if (target) {
    target.focus();      // moving focus fires 'change' on the cell we left, which saves it
    target.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  } else if (e.key === 'Enter' && !up) {
    input.blur();        // save this cell first; the new row is built after that save finishes
    await settled();
    addRow(col === 'code' ? 'code' : Number(col));
  }
});

// Scrolling the mouse wheel over a focused number cell must not change its value.
body.addEventListener('wheel', (e) => {
  if (e.target.matches('input[type=number]') && document.activeElement === e.target) e.target.blur();
}, { passive: true });

// Number cells show commas when idle and plain digits while you edit them.
body.addEventListener('focusin', (e) => { if (e.target.matches('input.num')) e.target.value = e.target.value.replace(/,/g, ''); });
body.addEventListener('input', (e) => {
  if (!e.target.matches('input.num')) return;
  let clean = e.target.value.replace(/[^0-9.\-]/g, '');   // digits, decimal point and minus only
  if (Math.abs(parseNum(clean)) > MAX_VALUE) clean = String(limit(parseNum(clean)));   // stop at 10,000,000
  if (clean !== e.target.value) e.target.value = clean;
});
body.addEventListener('focusout', (e) => {
  if (e.target.matches('input.num')) e.target.value = fmt(limit(parseNum(e.target.value)));
});

// Clicking or tabbing into a cell selects its whole value, so typing replaces it.
let justFocused = false;
body.addEventListener('focusin', (e) => {
  if (!e.target.matches('td input:not(.pick)')) return;
  justFocused = true;
  setTimeout(() => { if (document.activeElement === e.target) e.target.select(); }, 0);
});
body.addEventListener('mouseup', (e) => {
  if (justFocused && e.target.matches('td input:not(.pick)')) e.preventDefault();   // stops the click from clearing the selection
  justFocused = false;
});

// Automatic logout after 5 minutes without activity. Any click, key, touch or scroll counts as
// activity, and keeps the server-side login alive too.
const IDLE_MS = 5 * 60 * 1000;
let idleTimer;
async function idleLogout() {
  document.activeElement?.blur();      // commit a half-typed cell first
  await settled();
  try { await fetch(u('/logout'), { method: 'POST' }); } catch { /* reload below shows the login page anyway */ }
  try { sessionStorage.setItem('idleLogout', '1'); } catch { /* storage can be blocked */ }
  location.reload();
}
function activity() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(idleLogout, IDLE_MS);
  if (Date.now() - lastApi > 60e3) api('GET', '/api/ping').catch(() => {});
}
['pointerdown', 'pointermove', 'keydown', 'input', 'touchstart', 'scroll', 'wheel']
  .forEach((ev) => document.addEventListener(ev, activity, { passive: true, capture: true }));
activity();

document.getElementById('csv').addEventListener('click', () => {
  const q = (s) => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [['ID', ...columns.map((c, i) => c || letters(i + 1)), 'Total', 'Last Updated'].map(q).join(',')];
  for (const r of rows) lines.push([q(r.code), ...r.values, total(r), q(stamp(r.updatedAt))].join(','));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
  a.download = 'rows.csv'; a.click();
});

api('GET', '/api/data').then(load);
