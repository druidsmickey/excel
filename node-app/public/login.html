<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Row Tracker - Log in</title>
<style>
  body { font-family: Arial, sans-serif; background: #f3f6fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  form { background: #fff; padding: 28px 32px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0, 0, 0, .12); width: 280px; }
  h1 { font-size: 20px; margin: 0 0 16px; color: #1f4e78; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font: inherit; border: 1px solid #bbb; border-radius: 4px; }
  button { width: 100%; margin-top: 12px; padding: 10px; font: inherit; background: #1f4e78; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #err { color: #a00; font-size: 14px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
<form id="f">
  <h1>Row Tracker</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button id="go">Log in</button>
  <div id="err"></div>
</form>
<script>
try {
  if (sessionStorage.getItem('idleLogout')) {
    sessionStorage.removeItem('idleLogout');
    document.getElementById('err').textContent = 'You were logged out after 5 minutes of inactivity.';
  }
} catch { /* storage can be blocked */ }
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = '';
  try {
    const r = await fetch((location.pathname.endsWith('/') ? location.pathname : location.pathname + '/') + 'login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    if (r.ok) return location.reload();
    err.textContent = (await r.json()).error || 'Login failed';
  } catch { err.textContent = 'Could not reach the server'; }
  go.disabled = false;
  document.getElementById('pw').select();
});
</script>
</body>
</html>
